<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知識ハブの検索</title><link rel="stylesheet" href="workbench/knowledge/deep-dive.css"></head><body><a class="skip" href="#main">本文へ</a><main class="shell" id="main"><header class="panel"><nav><a href="index.html">Hub Top</a> / <a href="search.html">検索</a> / <a href="foundations/site-map.html">全ページ索引</a></nav><h1>知識ハブの検索</h1><p class="lead">現行の判断ガイドと当日の観測記録を分けて探せます。検索結果は根拠の正しさや鮮度を自動認定しません。</p><p class="small">最終更新: 2026-10-13 / 入口の編集日と、個別記事の公式確認日は別です。</p></header><section class="panel"><h2>検索</h2><label for="q">言葉・モデル名・用途</label><input id="q" type="search" placeholder="例: ontology preview 動画" style="width:100%;font:inherit;padding:12px"><label for="kind">資料の種類</label><select id="kind"><option value="current">現行ガイド・入口</option><option value="history">日次ニュース・履歴</option><option value="all">すべて</option></select><p id="count" aria-live="polite"></p><p class="small">複数語はすべて含むものを表示。曖昧検索ではありません。外部CDN・network・fetchなしで検索できます。</p></section><section class="panel"><h2>結果</h2><ul id="results"></ul><noscript><p>JavaScriptを使わない場合は<a href="foundations/site-map.html">全ページ索引</a>を使ってください。</p></noscript></section><footer class="panel"><h2>旧版と読み方</h2><p><a href="research/archive/index.html">旧版の資料棚</a> / <a href="foundations/archive-policy.html">履歴を読む</a></p><p><a href="https://github.com/alignlabai-rgb/claude/blob/4535dd63a3b2acf62ec793c02c9f8dbffabeece5/search.html">この入口の刷新前固定版</a>。過去の本文は新版に混在させていません。</p></footer></main><script>
const pages=[{"url": "Operations_Manuals/Antigravity_Operation/index.html", "title": "Antigravity操作ガイド：一つの変更を検証まで進める | AI実践ガイド", "desc": "Projects、計画、権限、差分を区切りとして使い、全権限や並列度を習熟の指標にしません。", "keywords": "Operations_Manuals Antigravity_Operation index.html", "category": "Operations_Manuals", "kind": "current_guide"}, {"url": "Operations_Manuals/ClaudeCode_Operation/index.html", "title": "Claude Code操作ガイド：読む・変更する・確かめる | AI実践ガイド", "desc": "CLIの入口から小さな成果を完了し、API、Cowork、定期実行との境界も確認します。", "keywords": "Operations_Manuals ClaudeCode_Operation index.html", "category": "Operations_Manuals", "kind": "current_guide"}, {"url": "Operations_Manuals/Codex_Operation/index.html", "title": "Codex操作ガイド：環境と証拠を揃えて完了する | AI実践ガイド", "desc": "ローカル・作業木・クラウドを区別し、依頼、実行、検査、Gitの区切りを観測します。", "keywords": "Operations_Manuals Codex_Operation index.html", "category": "Operations_Manuals", "kind": "current_guide"}, {"url": "Operations_Manuals/GitGitHub_Operation/index.html", "title": "GitとGitHub操作ガイド：保存・同期・公開を分ける | AI実践ガイド", "desc": "作業木、commit、リモート、main、配信を別の状態として確認する手順です。", "keywords": "Operations_Manuals GitGitHub_Operation index.html", "category": "Operations_Manuals", "kind": "current_guide"}, {"url": "Operations_Manuals/GrokBuild_Operation/index.html", "title": "Grok Build操作ガイド：計画・権限・実行を区別する | AI実践ガイド", "desc": "TUIと非対話実行を使う前に、sandboxの範囲と実際の完了証拠を確認します。", "keywords": "Operations_Manuals GrokBuild_Operation index.html", "category": "Operations_Manuals", "kind": "current_guide"}, {"url": "Operations_Manuals/Obsidian_Operation/index.html", "title": "Obsidian操作ガイド：根拠を残すノートと復旧 | AI実践ガイド", "desc": "ノートの量より、元資料へ戻れ、状態が分かり、壊れた時に復元できる構成を作ります。", "keywords": "Operations_Manuals Obsidian_Operation index.html", "category": "Operations_Manuals", "kind": "current_guide"}, {"url": "Operations_Manuals/index.html", "title": "操作マニュアル：入口と作用を分ける", "desc": "操作の目的、作業場所、権限、検査、停止を確認します。コマンドを読むことは実行や課金の承認ではありません。", "keywords": "Operations_Manuals index.html", "category": "Operations_Manuals", "kind": "navigation_or_template"}, {"url": "_routines/ai-tools-map-update.html", "title": "AIツール地図更新：機能から作業の接続へ | Routines", "desc": "似た名称のエージェントや制作ツールを並べるだけでは選べません。入力、成果物、実行場所、状態、副作用を揃えて、用途別に比較する手順です。", "keywords": "_routines ai tools map update.html", "category": "_routines", "kind": "routine_template"}, {"url": "_routines/hub-health-check.html", "title": "ハブ点検：古さではなく判断の破損を探す | Routines", "desc": "更新日の一覧を作るだけでなく、読者の選択を誤らせる箇所を見つける点検です。現行ガイド、日付記事、履歴を同じ鮮度基準で採点しません。", "keywords": "_routines hub health check.html", "category": "_routines", "kind": "routine_template"}, {"url": "_routines/index.html", "title": "Routines：速報と現行知識を両立する手順 | Routines", "desc": "日次ニュースの既存自動運用を維持しながら、速報を現行記事や実用的な選択へつなげる入口です。このページ自体はスケジュールや実行権限を変更しません。", "keywords": "_routines index.html", "category": "_routines", "kind": "routine_template"}, {"url": "_routines/link-checker.html", "title": "リンク検査：存在・意味・出力先を分ける | Routines", "desc": "リンクが開けること、記事の主張を支えること、正しい生成先で解決されることは別です。自動検査の範囲を理解し、誤った安心や不要な削除を避けます。", "keywords": "_routines link checker.html", "category": "_routines", "kind": "routine_template"}, {"url": "_routines/llm-tracker-update.html", "title": "LLMトラッカー更新：モデル名から提供条件へ | Routines", "desc": "新しい名前を集めるだけでなく、読者がどの入口で何を使えるかを確かめます。速報の価値を保ちつつ、現在の仕様として採用するには別の証拠を揃えます。", "keywords": "_routines llm tracker update.html", "category": "_routines", "kind": "routine_template"}, {"url": "_routines/news-template.html", "title": "AI News {{DATE_JP}} | ALIGN Lab", "desc": "制作・エージェント・LLMの今日の信号。速報の価値と、まだ確かめていない範囲を一緒に伝えます。", "keywords": "_routines news template.html", "category": "_routines", "kind": "routine_template"}, {"url": "_routines/session-start.html", "title": "再開する前の小さな確認 | Routines", "desc": "毎回の作業を過去の指示だけで再開しないための手順です。まず現在の依頼、対象差分、証拠と未確認を読み、一つの完成物へ戻ります。", "keywords": "_routines session start.html", "category": "_routines", "kind": "routine_template"}, {"url": "claw-stack/agent-brain-guide.html", "title": "Agent Brain：モデルと実行基盤を分けて選ぶ | Claude Knowledge Hub", "desc": "このページの Agent Brain は特定の新製品名ではなく、エージェントの推論に使うモデルを選ぶための便宜的な呼称である。旧記事の「主脳は必ずクラウド、ローカルは下流」という固定序列は採用しない。任せる仕事の入力、ツール、停止条件を先に定義し、候補モデルがその契約を守れるかで選ぶ。", "keywords": "claw stack agent brain guide.html", "category": "claw-stack", "kind": "current_guide"}, {"url": "claw-stack/comparison.html", "title": "OpenClaw・PicoClaw・NanoClaw・Hermes：境界から比較する | Claude Knowledge Hub", "desc": "エージェント比較で重要なのは、対応チャネルの数より「同じ入力がどこへ届き、何を書き換えられるか」である。ここでは四製品を、実装の観察可能な構造から比較する。性能順位、安全性の認定、導入実績の比較ではない。各プロジェクトは更新が速く、実際の版と設定を固定してから試す必要がある。", "keywords": "claw stack comparison.html", "category": "claw-stack", "kind": "current_guide"}, {"url": "claw-stack/index.html", "title": "Claw Stack：常設エージェントを選ぶための入口 | Claude Knowledge Hub", "desc": "チャットから頼めば、資料を読み、手順を実行し、時間になれば結果を返す。常設エージェントの魅力はこの連続性にある。しかし選ぶべきものは「最も賢いボット」ではない。誰が入口を使い、どのデータが記憶に残り、実行の失敗を誰が回収するかを含む、小さな運用システムである。この棚は製品の機能数を競う入口ではなく、その運用を設計する入口として読む。", "keywords": "claw stack index.html", "category": "claw-stack", "kind": "navigation_or_template"}, {"url": "claw-stack/nanoclaw/index.html", "title": "NanoClaw：コンテナ、配送、共有単位を切り分ける | Claude Knowledge Hub", "desc": "NanoClaw を理解する入口は「小さい OpenClaw」という呼び方ではなく、ホストの配送とエージェントの実行を切り分ける設計にある。現在の公式リポジトリは nanocoai/nanoclaw。旧 namespace のリンクは現行へリダイレクトすることを確認した。NanoClaw 公式リポジトリ コンテナがあるだけで安全認定をするのではなく、何を共有し、何を外へ出せるかを読む。", "keywords": "claw stack nanoclaw index.html", "category": "claw-stack", "kind": "navigation_or_template"}, {"url": "claw-stack/openclaw/index.html", "title": "OpenClaw：チャット入口と実行基盤を一つの Gateway でつなぐ | Claude Knowledge Hub", "desc": "OpenClaw を導入する理由は、会話の画面を増やすことではない。いつものチャネルから受けた依頼を、設定したモデルとツールへつなぎ、継続する作業として扱えることにある。モデルを一つ抱える専用ボットではなく、入口・状態・実行を組み合わせるシステムとして理解すると、便利さと負担の両方が見える。", "keywords": "claw stack openclaw index.html", "category": "claw-stack", "kind": "navigation_or_template"}, {"url": "claw-stack/picoclaw/index.html", "title": "PicoClaw：小さなランタイムの価値を、条件付きで測る | Claude Knowledge Hub", "desc": "PicoClaw の魅力は、エージェントの常設部分を軽くして、小型機器でも試せる可能性にある。ただし小さなランタイムと、小さなモデルは別物だ。どこで推論するか、何へ通信するか、何を実行できるかを分けないと、低メモリの説明から「無料で完全ローカルの AI」ができるという誤解が生まれる。", "keywords": "claw stack picoclaw index.html", "category": "claw-stack", "kind": "navigation_or_template"}, {"url": "creator-system/Claude_Design/Claudeで100本_ユースケース辞典.html", "title": "Claudeで100本 — 完成を増やすための、検査可能な小さな仕事辞典", "desc": "この辞典は、Claudeが単独で百種類の仕事を完成保証する一覧ではありません。人間や別の担当者が検査し、次の作業へ渡せる小さな仕事の候補を百件に整理したものです。すべて筆者の用途提案で、実行実績や性能比較ではありません。百件を全部行う必要もありません。", "keywords": "creator system Claude_Design Claudeで100本_ユースケース辞典.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/Claude_Design/Claudeでしくじる_落とし穴とアンチパターン.html", "title": "Claudeでしくじる — 失敗を分類し、次に検出できる教材へ変える", "desc": "AI制作の失敗は、候補を捨てて終わりにすると次回も繰り返されます。一方、すべてを「プロンプトが悪い」とまとめても直す場所が分かりません。失敗の症状、条件、戻り先、再検査を記録し、次の人が同じ欠陥を見つけられる教材へ変えることが本稿の目的です。", "keywords": "creator system Claude_Design Claudeでしくじる_落とし穴とアンチパターン.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/Claude_Design/Claudeでつくる_クリエイティブ・ワークフロー大全.html", "title": "Claudeでつくる — 企画から受け渡しまでを、検査できる仕事に分ける", "desc": "Claudeへ一度に「作品を作って」と頼むと、どこまでが企画、どこからが事実、何が納品物なのか曖昧になります。実用的な創作支援は、案を出す、構造を決める、候補を作る、検査する、直す、渡すという仕事へ分けるところから始まります。本稿は架空の教材による設計案で、実際の制作実績ではありません。", "keywords": "creator system Claude_Design Claudeでつくる_クリエイティブ・ワークフロー大全.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/Claude_Design/Claudeでデザインする_実例とプロンプトの教科書.html", "title": "Claudeでデザインする — Designテンプレートで、画面の目的と動作を検査する", "desc": "デザイン支援は、見栄えの良い画面を得ることだけではありません。何を伝え、どこを操作し、何が起きたら目的を達成するかを定める仕事です。Claude Designを使う場合も、ラフ、操作可能な試作、本番実装、公開の状態を混ぜないことが重要になります。", "keywords": "creator system Claude_Design Claudeでデザインする_実例とプロンプトの教科書.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/Claude_Design/Claudeで仕組み化する_反復と継続の設計.html", "title": "Claudeで仕組み化する — 繰り返す入力を、停止条件のある工程へ", "desc": "仕組み化は、同じプロンプトを定時に投げることだけではありません。入力の要件、成果の形、検査、差し戻し、停止条件を固定し、繰り返しても余計な効果が起きない工程にする仕事です。自動化ができることと、実行してよいことを分けます。", "keywords": "creator system Claude_Design Claudeで仕組み化する_反復と継続の設計.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/Claude_Design/Claudeで動かす_動画とモーションの実例集.html", "title": "Claudeで動かす — Motionと生成動画を分け、意味が伝わる動きを作る", "desc": "動く表現には、文字や図のアニメーション、操作可能な画面、生成映像があります。これらを「Claudeが動画を作る」の一文へまとめると、何を直せるか、何を検査するかが見えません。まず必要な動きと出力を決め、その役割に合う制作面を選びます。", "keywords": "creator system Claude_Design Claudeで動かす_動画とモーションの実例集.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/Claude_Design/Claudeで書く_ライティング実例集.html", "title": "Claudeで書く — 文章の目的、根拠、編集を分離する", "desc": "文章をClaudeへ任せる時に重要なのは、何を書くかだけでなく、何を根拠として、誰が読み、何に使うかです。説明、提案、物語、要約は同じ品質基準ではありません。長い文章が出たことを成果にせず、必要な意味が正しい形で伝わるかを検査します。", "keywords": "creator system Claude_Design Claudeで書く_ライティング実例集.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/Claude_Design/Claudeで続ける_長期戦の伴走.html", "title": "Claudeで続ける — 記憶に任せず、現在の根拠と再開条件を残す", "desc": "長期の制作は、毎回すべてを思い出すことでも、一つの会話を無限に伸ばすことでもありません。今の目的、採用した判断、必要な根拠、未確認、次の一手を保存し、別の会話や担当でも再開できることが大切です。モデルの記憶を、唯一の原本や判断台帳にしない設計を提案します。", "keywords": "creator system Claude_Design Claudeで続ける_長期戦の伴走.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/Claude_Design/Claudeとはたらく_チームと共有の作法.html", "title": "Claudeとはたらく — 共同編集、共有、採否の判断を分ける", "desc": "チームでClaudeを使う時、情報を一箇所へ集めるだけでは共同作業になりません。誰が入力を用意し、誰が制作し、誰が検査し、誰が公開を決めるかを分け、成果と判断が受け取れる状態にする必要があります。共有機能があることと、組織の権限が成立することは別です。", "keywords": "creator system Claude_Design Claudeとはたらく_チームと共有の作法.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/Claude_Design/Claudeと対話する_会話の作法.html", "title": "Claudeと対話する — 長い会話より、問いと出口を設計する", "desc": "Claudeとの会話は、質問を重ねれば自動的に良い仕事へ収束するわけではありません。何を決めたいか、今ある資料は何か、どんな出力を受け取れば次へ進めるかを整理すると、対話が制作の道具になります。会話の親しみやすさと、事実・権限・完成の確認を別に保ちます。", "keywords": "creator system Claude_Design Claudeと対話する_会話の作法.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/Claude_Design/index.html", "title": "Claude制作ガイド — 現行のArtifactsと、検査できる十の方法", "desc": "旧来の「Claudeで何でも作る」一覧を、現在の制作面と実際の工程から読み直すガイドです。モデルの紹介と、候補生成、品質検査、作品への採用、公開を分けています。製品事実は公式資料で確認し、教材と手順は筆者の設計案として明示します。実行していない制作や導入を成功実績として扱いません。", "keywords": "creator system Claude_Design index.html", "category": "creator-system", "kind": "navigation_or_template"}, {"url": "creator-system/evaluation.html", "title": "AI制作の評価 — 綺麗さより先に、致命的欠陥と用途を判定する", "desc": "評価の役割は、作り手の努力に点を付けることではありません。候補を作品へ渡せるか、渡せないならどこを直すかを明確にすることです。生成品質、作品への適合、受け渡し、権利、公開判断を分け、総合点が重大な欠陥を隠さない設計を提案します。", "keywords": "creator system evaluation.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/genai-tools.html", "title": "生成AIツール選定 — 最新モデルを、実際の工程課題へ落とす", "desc": "ツールの一覧は便利ですが、制作の課題が定まらないまま増やすと、試遊が仕事へ変わりません。選定は「画像・動画・音楽のどれが一番強いか」ではなく、「現在どこが止まり、その道具がどの入力をどの出力へ変えるか」から始めます。", "keywords": "creator system genai tools.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/index.html", "title": "Creator System：制作を再利用可能にする", "desc": "生成するだけでなく、入力、工程、検査、repair、採用、公開の区切りまでを設計します。架空の収益や作品成功を実績として扱いません。", "keywords": "creator system index.html", "category": "creator-system", "kind": "navigation_or_template"}, {"url": "creator-system/kpi-dashboard.html", "title": "制作KPI — 生成件数ではなく、受け渡しと手戻りを測る", "desc": "AI制作の数字は、作業を助けるために使います。生成枚数、使ったトークン、消費したクレジットが増えても、観客が読める作品や再利用できる方法が増えたとは限りません。ダッシュボードは管理の成果物を量産する場所ではなく、どの工程を直すべきか判断する小さな計器として設計します。", "keywords": "creator system kpi dashboard.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/manga-comfyui-2026.html", "title": "ComfyUIで漫画を作る — 参照・コマ・文字を分離した検査可能な工程", "desc": "漫画向けのComfyUI工程は、大きな万能グラフより、参照を作る部分、コマを作る部分、修正する部分を説明できる方が実用的です。画像が出ること、キャラクターが似ること、ページが読めることはそれぞれ違う検査です。ここでは未実行の合成教材を使い、特定のモデルが万能だとは推奨しません。", "keywords": "creator system manga comfyui 2026.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/manga-pipeline.html", "title": "AI漫画の工程 — 絵の良さより先に、読順と出来事を成立させる", "desc": "漫画は綺麗な画像の集合ではありません。読者がどの順に見て、誰が話し、何が変わったかを理解できる連続した表現です。画像生成を使う時も、筋、コマ割り、文字、視線、接続の設計を独立させます。本稿は一般的な制作工程案で、架空の教材を使います。", "keywords": "creator system manga pipeline.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/monetization.html", "title": "AI制作と事業化 — 収益を想像する前に、提供条件を検査する", "desc": "AI制作物が作れることと、商品として提供できることは違います。事業化の検討では、誰に何を渡すか、どの権利と条件で、どこまで修正や説明を約束するかを明確にします。本稿は条件設計の解説です。市場規模、相場、架空の売上、利益、顧客獲得の成功を示しません。", "keywords": "creator system monetization.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/openclaw.html", "title": "OpenClawと制作運用 — 依頼を運ぶ役割と、作品を採る判断を分ける", "desc": "制作の入口を自動化すると、依頼の取りこぼしや素材不足を減らせる可能性があります。一方、メッセージを受け取れるエージェントが、作品の品質、権利、公開をすべて判断する設計は危険です。本稿ではOpenClawを制作依頼の入口や補助処理の候補として扱い、採否の権限は工程ごとに残します。", "keywords": "creator system openclaw.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/overview.html", "title": "AI制作システム — 一つの成果を、次の人が使える工程へ", "desc": "制作システムを整える目的は、生成件数や管理資料を増やすことではありません。作品の意図が候補生成の偶然に埋もれず、次の担当者が成果と判断理由を受け取れることです。本ガイド群は公開技術情報に基づく汎用の工程提案で、特定組織の権限・承認ルールを定めません。", "keywords": "creator system overview.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/spec.html", "title": "制作仕様書 — プロンプトより先に、完成と不適合を定義する", "desc": "仕様書は長い発注文ではありません。何を作り、何を作らず、どう受け取れば完成と判定できるかを、制作と検査の双方が同じ意味で読める形にする道具です。プロンプトはその仕様をある生成器へ翻訳した入力であり、仕様そのものの代わりにはなりません。", "keywords": "creator system spec.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/stack-map.html", "title": "制作スタックの設計 — 道具を並べず、入力と出口を接続する", "desc": "制作スタックの図を製品ロゴの一覧で終えると、どこに素材が入り、何がどこへ渡るかが分かりません。必要なのは、企画、参照、生成、編集、検査、保存、公開候補の各層で、入力と出力の契約を決めた地図です。本稿は一般向けの設計案で、特定組織の担当権限を変更しません。", "keywords": "creator system stack map.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/topic-generator.html", "title": "企画候補の生成 — ニュースをそのまま作品にせず、問いと検査へ変える", "desc": "企画生成は、流行語を作品タイトルへ貼る作業ではありません。どの対象に、何を感じたり理解したりしてほしいかという問いを作り、候補の差を比較する仕事です。ニュースやSNSは着想の入口になり得ますが、事実、人気、権利、作品の価値を同時に証明しません。", "keywords": "creator system topic generator.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/video-comfyui-2026.html", "title": "ComfyUIの動画制作 — メモリと時間を見積もる前に、動作を検査する", "desc": "動画向けのComfyUIグラフは、静止画より部品と出力が増えます。モデル、参照、フレーム、尺、音、結合、保存を分け、エラーの原因と品質の欠陥を同じ問題として扱わないことが重要です。ここでは合成教材を使う未実行の工程設計を説明し、特定のGPUやメモリ量で動くと保証しません。", "keywords": "creator system video comfyui 2026.html", "category": "creator-system", "kind": "current_guide"}, {"url": "creator-system/video-pipeline.html", "title": "AI動画の工程 — ショット、音、編集点を先に決める", "desc": "動画制作の失敗は、生成映像が不自然なことだけではありません。前後の動作がつながらない、台詞の意味が違う、字幕が読めない、書き出し先で画面が切れる、といった後工程の問題もあります。候補生成から完成映像までを分け、各段階で何を検査するかを先に決めます。", "keywords": "creator system video pipeline.html", "category": "creator-system", "kind": "current_guide"}, {"url": "demos/agent-deep-dive.html", "title": "Skillとサブエージェント：再利用と並列を別々に設計する | AI実践ガイド", "desc": "資料照合の方法を使い回すことと、人手のように作業者を増やすことは別の問題です。", "keywords": "demos agent deep dive.html", "category": "demos", "kind": "current_guide"}, {"url": "demos/codex-claude-ma-adoption.html", "title": "資料チームへのAI導入：小さな検証から採用を決める | AI実践ガイド", "desc": "ブランド別の役割固定や大きな効率化の約束ではなく、資料作業を端から端まで評価します。", "keywords": "demos codex claude ma adoption.html", "category": "demos", "kind": "current_guide"}, {"url": "demos/codex-vs-opus.html", "title": "CodexとClaude Opus：公平な比較の作り方 | AI実践ガイド", "desc": "製品とモデルの軸を揃え、同じ課題・証拠・制約で選択を評価するための教材です。", "keywords": "demos codex vs opus.html", "category": "demos", "kind": "current_guide"}, {"url": "demos/index.html", "title": "Demos：失敗を見つける試験教材", "desc": "過去のデモを無条件に成功例とみなさず、合成fixture・比較・反証・検査範囲から使い直します。", "keywords": "demos index.html", "category": "demos", "kind": "navigation_or_template"}, {"url": "demos/ma-demo-2026.html", "title": "合成資料で試すAIレビュー：根拠を失わない六段階 | AI実践ガイド", "desc": "旧M&Aデモの実績を再認定せず、人工の資料だけで抽出・照合・保留を練習します。", "keywords": "demos ma demo 2026.html", "category": "demos", "kind": "current_guide"}, {"url": "demos/routines-deep-dive.html", "title": "定期実行から有益な差分へ：Routineの設計実習 | AI実践ガイド", "desc": "毎日文章を生むのではなく、変化の根拠と次に判断する問いを残すための設計です。", "keywords": "demos routines deep dive.html", "category": "demos", "kind": "current_guide"}, {"url": "demos/why-claude-code.html", "title": "なぜClaude Codeを選ぶか：チャットから作業環境へ | AI実践ガイド", "desc": "チャットを否定せず、ファイル・実行・検証が必要な仕事でエージェントを選ぶ理由を説明します。", "keywords": "demos why claude code.html", "category": "demos", "kind": "current_guide"}, {"url": "foundations/agent-protocol.html", "title": "Agent Protocol — 読む・作る・判断する・届けるを分ける | Foundations", "desc": "これは公開知識ハブの編集にagentを使うための作業手順です。通信protocolや組織の権限規則ではありません。記事が完成しても、他の担当者の作業開始や製品の採用が自動で決まるわけではありません。根拠、差分、未確認を見える形で渡すことが中心です。", "keywords": "foundations agent protocol.html", "category": "foundations", "kind": "current_guide"}, {"url": "foundations/align-lab-context.html", "title": "公開ハブと非公開資料 — 接続しても混ぜない | Foundations", "desc": "この公開ハブはAIの技術、制作、運用方法を人が読める形で整理します。ALIGN Labに有益な方法を考えることと、非公開の組織資料を公開repoへ写すことは別です。接続は、秘密を含まない問いと根拠付きの候補から始めます。", "keywords": "foundations align lab context.html", "category": "foundations", "kind": "current_guide"}, {"url": "foundations/anti-patterns.html", "title": "アンチパターン — 失敗を次の検査へ変える | Foundations", "desc": "失敗を「AIが悪い」で閉じると、次のmodelでも同じ問題が起きます。再利用できる記録は、起きた条件、観測した誤り、誤っていた前提、検査の追加を分けます。ここでは現行編集の典型的な合成例と、旧事例への入口を整理します。", "keywords": "foundations anti patterns.html", "category": "foundations", "kind": "current_guide"}, {"url": "foundations/archive-policy.html", "title": "保存版の扱い — 旧情報を失わず、現行の判断と分ける | Foundations", "desc": "古い情報には二つの問題があります。現在の使い方として誤読されることと、過去の判断の理由が消えることです。このハブは現行guideを再構成し、旧本文を固定版へ分離します。日付付きの記事は当時の観測として保持し、同じ画面に複数の「最新」を混ぜません。", "keywords": "foundations archive policy.html", "category": "foundations", "kind": "current_guide"}, {"url": "foundations/decisions.html", "title": "編集設計と過去の判断を読む | Foundations", "desc": "現在の読者導線を説明するページと、過去の意思決定の入口を分離しました。歴史的なADRを再採択したことにも、現在の実行権限を与えたことにもなりません。", "keywords": "foundations decisions.html", "category": "foundations", "kind": "current_guide"}, {"url": "foundations/definition-of-done.html", "title": "完成基準：書いた・確かめた・届いたを分ける | Foundations", "desc": "長い本文や検査の緑表示だけで完成を宣言しないための、公開知識ページの引き渡し基準です。制作、事実確認、独立レビュー、公開反映を別々に扱います。", "keywords": "foundations definition of done.html", "category": "foundations", "kind": "current_guide"}, {"url": "foundations/glossary.html", "title": "用語集：モデル・提供面・証拠を混同しない | Foundations", "desc": "このハブで判断を左右する語を、短い定義と取り違えやすい相手で整理します。製品の最新仕様は用語集へ複製せず、それぞれの現行記事へ戻ります。", "keywords": "foundations glossary.html", "category": "foundations", "kind": "current_guide"}, {"url": "foundations/index.html", "title": "Foundations：根拠・品質・履歴の作法", "desc": "公開知識を維持するための編集方針と再利用方法です。組織権限、秘密、canon、契約の決定を代行しません。", "keywords": "foundations index.html", "category": "foundations", "kind": "navigation_or_template"}, {"url": "foundations/multi-instance-protocol.html", "title": "並列編集：速度を上げても証拠と差分を失わない | Foundations", "desc": "複数の人やエージェントが同じ公開リポジトリを編集するときの実用手順です。並列化の単位は人数ではなく、独立して完成と検査ができる成果物です。", "keywords": "foundations multi instance protocol.html", "category": "foundations", "kind": "current_guide"}, {"url": "foundations/onboarding-checklist.html", "title": "初回編集の入口：公開ハブを安全に理解する | Foundations", "desc": "新しくこのリポジトリを読む人・編集する人向けの確認表です。すべての過去記事を読むことではなく、現在の編集契約と一つの実用成果を結び付けることを目指します。", "keywords": "foundations onboarding checklist.html", "category": "foundations", "kind": "current_guide"}, {"url": "foundations/operating-principles.html", "title": "運用原則 — 情報量を判断と制作へつなげる | Foundations", "desc": "知識ハブは記事を増やすだけでは育ちません。読む人が違いを理解し、次の小さな試験を設計でき、失敗から方法を残せることが価値です。ここでは本ハブの編集原則を示します。内部組織のauthorityや契約を新しく定める文書ではありません。", "keywords": "foundations operating principles.html", "category": "foundations", "kind": "current_guide"}, {"url": "foundations/page-template.html", "title": "記事テンプレート：根拠と用途から書く", "desc": "最新というラベルではなく、読者が選択・試験できる本文を作るための型です。", "keywords": "foundations page template.html", "category": "foundations", "kind": "navigation_or_template"}, {"url": "foundations/site-map.html", "title": "全ページ索引", "desc": "既存の各URLを保ち、現行指南と日付付き履歴を分けた索引です。各ページの確認範囲はその本文で確認してください。", "keywords": "foundations site map.h 理します。", "keywords": "workbench knowledge ai tools map.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/anti-gravity.html", "title": "Antigravity — 開発surfaceと管理API agentを分けて理解する", "desc": "Antigravityという名前は、開発アプリ、CLI、IDEと、Googleが実行環境を管理するAPI agentの両方に現れます。操作範囲、認証、課金、成果の受け取り方をsurfaceごとに確認します。", "keywords": "workbench knowledge anti gravity.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/azure-ai-foundry.html", "title": "Microsoft Foundry：モデルから運用までの開発基盤 | AI Knowledge Hub", "desc": "旧Azure AI Foundryの説明を刷新。portalの一般提供、個別機能のpreview、classicとの互換、モデルの契約と配置を分けて選ぶ。", "keywords": "workbench knowledge azure ai foundry.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/base44.html", "title": "Base44 — Skillsを使っても本番境界は自分で設計する | Claude Knowledge Hub", "desc": "Base44はアプリのbackendや開発workflowを提供するplatformです。Base44 Skillsはその操作をcoding agentへ教える公式instruction群であり、Agent Skills標準そのものではありません。正しいAPI名を教える助けにはなりますが、幻覚ゼロ、permission安全、deployの成功を保証するものではありません。", "keywords": "workbench knowledge base44.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/bonsai-8b.html", "title": "Bonsai — 1-bit 8Bから現行familyまで、圧縮と実用を分ける | Claude Knowledge Hub", "desc": "PrismMLのBonsaiは低bitの重み表現による効率を狙うモデルfamilyです。旧版の「1.15GBで動く」「FP16と同等」「世界初」をそのまま購買や導入判断に使わず、どの重み、どのruntime、どのtaskの主張かへ分解します。Bonsai 8BとBonsai 2 27Bは同じモデルではありません。", "keywords": "workbench knowledge bonsai 8b.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/chatgpt.html", "title": "ChatGPTを仕事の入口として選ぶ | Knowledge", "desc": "モデルのランキングより、仕事の入口・材料・検証・権限を揃えるための実践ガイドです。", "keywords": "workbench knowledge chatgpt.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/china-ai-coding.html", "title": "中国系AIコーディングを選ぶ — ブランド比較から運用設計へ | Knowledge", "desc": "安い、速い、長いcontextだけでは導入判断になりません。DeepSeek、Qwen、Kimi、GLM、MiniMaxを、完成物・権限・再現性・回復コストから選ぶための実践設計です。", "keywords": "workbench knowledge china ai coding.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code.html", "title": "Claude Code実践 — 任せる範囲と検証を設計する | AI Knowledge Hub", "desc": "Claude Codeは、ソースを読み、複数ファイルを編集し、コマンドを実行して開発ツールと連携するエージェント型の開発環境です。terminal、IDE、desktop、webという提供面があります。公式Overview。しかし、どの面で使っても「変更を作った」と「正しく動くことを確認した」と「本番へ反映した」は別の結果です。", "keywords": "workbench knowledge claude code.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/agent-teams.html", "title": "Agent Teams — 実験的なチーム機能を見極める | Claude Code実践", "desc": "専用文脈と相互連絡を使う場面、使わない場面、終了確認を具体化します。", "keywords": "workbench knowledge claude code agent teams.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/antipatterns.html", "title": "Claude Codeの失敗パターン — 原因を修正へ結ぶ | Claude Code実践", "desc": "見かけの成功と実物の不達を分け、同じ失敗を繰り返さない方法に変えます。", "keywords": "workbench knowledge claude code antipatterns.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/api-deep-dive.html", "title": "Claude API実装 — 応答より先に失敗を設計する | Claude Code実践", "desc": "Messages APIとClaude Codeを区別し、tool・stream・再開を堅牢なアプリへ結びます。", "keywords": "workbench knowledge claude code api deep dive.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/architecture.html", "title": "エージェントが迷わないプロジェクト設計 | Claude Code実践", "desc": "ファイルを増やすより、正本・変更境界・検証入口を見つけやすくする設計です。", "keywords": "workbench knowledge claude code architecture.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/capabilities.html", "title": "Claude Code機能の選択 — command一覧より用途から | Claude Code実践", "desc": "対話・非対話・IDE・cloud・GUIの違いを理解し、必要な機能だけを使います。", "keywords": "workbench knowledge claude code capabilities.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/computer-use.html", "title": "Computer Use — APIと実際の画面操作を分ける | Claude Code実践", "desc": "スクリーンの観察、操作の実行、結果の確認を切り分けてGUI作業を評価します。", "keywords": "workbench knowledge claude code computer use.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/cookbook.html", "title": "Claude Code実務レシピ — 小さな完成物を作る | Claude Code実践", "desc": "調査・修正・文書・reviewを、入力と反例のある仕事として組み立てます。", "keywords": "workbench knowledge claude code cookbook.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/cowork.html", "title": "Claude Cowork — cloudの継続とローカル接続の境界 | Claude Code実践", "desc": "文書仕事を任せる際の入力・保存・確認を、現在の提供面から考えます。", "keywords": "workbench knowledge claude code cowork.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/extended-thinking.html", "title": "Thinkingとeffort — 深く考えさせる前に設計する | Claude Code実践", "desc": "思考量、応答時間、料金、行動権限を分けて調整するためのガイドです。", "keywords": "workbench knowledge claude code extended thinking.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/glossary.html", "title": "Claude Code用語集：似た言葉の境界を読む | Claude Code実践", "desc": "言葉を暗記するためではなく、設定・責任・検証の対象を取り違えないための短い辞書です。", "keywords": "workbench knowledge claude code glossary.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/index.html", "title": "Claude Code実践ガイド：仕事から章を選ぶ | Claude Code実践", "desc": "新機能を順番に覚えるのではなく、解決したい作業の形から読み始めるための案内です。", "keywords": "workbench knowledge claude code index.html", "category": "workbench", "kind": "navigation_or_template"}, {"url": "workbench/knowledge/claude-code/ma-dd-playbook.html", "title": "資料レビュー支援 — DDの作業と判断を分ける | Claude Code実践", "desc": "合成データで抽出・照合・欠損検知を設計し、専門的な採否をAIへ丸投げしません。", "keywords": "workbench knowledge claude code ma dd playbook.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/mcp-complete.html", "title": "MCP運用設計 — 障害・更新・権限を閉じる | Claude Code実践", "desc": "初回接続後の保守を、tool契約と結果照合を軸に設計します。", "keywords": "workbench knowledge claude code mcp complete.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/mcp.html", "title": "MCP接続の始め方 — 最初の読取toolを確かめる | Claude Code実践", "desc": "接続・認証・tool公開・permission・結果を分けて、外部情報を安全に利用します。", "keywords": "workbench knowledge claude code mcp.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/mechanics.html", "title": "Claude Codeの内部動作を、運用の判断に使う | Claude Code実践", "desc": "文脈・tool往復・圧縮・キャッシュを理解し、長い作業の失敗箇所を見分けます。", "keywords": "workbench knowledge claude code mechanics.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/orchestration.html", "title": "エージェントの工程設計 — 分担より受渡しを先に作る | Claude Code実践", "desc": "担当ごとの証拠と編集境界を結び、並列結果を一つの完成物へ統合します。", "keywords": "workbench knowledge claude code orchestration.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/prompt-engineering.html", "title": "エージェントへの依頼設計 — 文章を実行契約へ | Claude Code実践", "desc": "目的・証拠・権限・完成条件を具体化し、曖昧な依頼を検証できる仕事へ変えます。", "keywords": "workbench knowledge claude code prompt engineering.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/routines.html", "title": "定期・イベント自動実行 — Routinesとローカル処理を分ける | Claude Code実践", "desc": "いつ、どこで、何を実行し、どの結果を確認するかを設計します。", "keywords": "workbench knowledge claude code routines.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-code/skills-guide.html", "title": "Claude Code Skills — 繰り返す方法を再利用する | Claude Code実践", "desc": "一回の長い依頼を、適用条件と反例を持つ小さな方法へ変えます。", "keywords": "workbench knowledge claude code skills guide.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-model.html", "title": "Claudeの選び方 — モデル・利用面・評価を分ける | AI Knowledge Hub", "desc": "Claudeという名前だけでは、何ができ、何が請求され、どのデータが渡るかは決まりません。まず「モデルは何か」「どのアプリまたはAPIか」「どのツール権限を与えるか」「何を完成と判定するか」を分けます。高性能なモデルに変更しても、読めない資料が読めるようになったり、送信の権限が自動的に生まれたりはしません。", "keywords": "workbench knowledge claude model.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/claude-mythos.html", "title": "Claude MythosとGlasswing — 限定アクセスを正しく理解する | AI Knowledge Hub", "desc": "2026-10-13に取得した公式仕様では、Mythos 5.1はActiveでverification required、モデルIDはclaude-mythos-5-1です。Fable 5.1と同じ仕様・料金を持ち、所定のverification programで確認された組織だけが利用できると説明されています。通常の有料プランを購入しただけでアクセスできるとは書かれていません。Mythos 5.1公式仕様", "keywords": "workbench knowledge claude mythos.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/comfyui-cloud.html", "title": "Comfy Cloud — GPUを借りる便利さと、持ち出せる工程を両立する", "desc": "Comfy Cloudは、手元のGPUを増設せず、ブラウザでComfyUIの制作グラフを扱うためのホスト環境です。導入の利点は計算機の調達だけでなく、部品の準備を減らせることにあります。一方、ローカル環境と同じグラフが必ず動く、外部送信がなくなる、という理解では選べません。", "keywords": "workbench knowledge comfyui cloud.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/comfyui.html", "title": "ComfyUI — 再実行できる生成グラフを、制作工程として管理する", "desc": "ComfyUIの価値は、画面に多数のノードを並べることではありません。モデル、参照、変換、保存を明示したグラフを再利用し、どこを変えたか説明できることです。単発の画像を得る作業と、第三者が安全に開いて理解できる制作工程を残す作業は区別します。", "keywords": "workbench knowledge comfyui.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/context-engineering.html", "title": "コンテキスト設計：必要な情報を、使える状態で渡す | Claude Knowledge Hub", "desc": "長いプロンプトではなく、今の仕事に適用できる根拠・状態・制約を選び、誤った情報を入れないための設計です。", "keywords": "workbench knowledge context engineering.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/copilot-excel-agent.html", "title": "ExcelのCopilot：計算を監査できる形で作る | AI Knowledge Hub", "desc": "直接編集、plan、chatを使い分け、合計・率・単位・formulaを保存する。AIが作った表を、見栄えではなく再計算と反証で評価する。", "keywords": "workbench knowledge copilot excel agent.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/copilot-powerpoint-agent.html", "title": "PowerPointのCopilot：伝わるdeckと正しい主張 | AI Knowledge Hub", "desc": "ファイル作成と既存deckの編集を分け、audience・論証・事実カード・brandをつなぐ。見栄えを内容の正しさへ読み替えない実践。", "keywords": "workbench knowledge copilot powerpoint agent.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/copilot-studio-guide.html", "title": "Copilot Studio実践：根拠付き回答を業務へ渡す | AI Knowledge Hub", "desc": "一つのagentを、knowledgeの準備から反証試験、actionの導入、運用確認まで作る。公開FAQの案内を題材に、役立つ回答と危険な確定処理を分ける。", "keywords": "workbench knowledge copilot studio guide.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/copilot-studio.html", "title": "Copilot Studio：agent・workflow・harnessを選ぶ | AI Knowledge Hub", "desc": "旧チャットボットの説明から刷新。会話を作る機能と業務を実行する基盤を分け、現在のharness、知識、ツール、課金の関係を理解する。", "keywords": "workbench knowledge copilot studio.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/copilot-word-agent.html", "title": "WordのCopilot：文章を変えても事実を失わない | AI Knowledge Hub", "desc": "CopilotアプリのWord Agentと、Word内の直接編集を区別。下書きから改稿、根拠の保存、意味のreviewまでを扱う。", "keywords": "workbench knowledge copilot word agent.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/cursor.html", "title": "Cursor — エージェントの速度をレビュー可能な変更へ変える | Claude Knowledge Hub", "desc": "Cursorはモデル名ではなく、モデル・instruction・toolを統合してコードを変更する開発環境です。便利さの中心は編集から実行までのloopですが、同じloopが意図しない副作用も生みます。最新機能を全部有効にする前に、対象workspace、実行境界、reviewの出口を決めましょう。", "keywords": "workbench knowledge cursor.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/deepseek.html", "title": "DeepSeek実務設計 — モデル名・視覚入力・移行を分ける | Knowledge", "desc": "低価格という印象ではなく、API契約、入力の形、実行権限、検証可能な出力から選ぶ。チャット画面、API、公開重み、エージェント実行基盤を分けると導入判断が明確になります。", "keywords": "workbench knowledge deepseek.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/docker.html", "title": "Docker — 再現できる実行環境と境界を設計する | Claude Knowledge Hub", "desc": "Dockerを使う価値は、AIが作ったコードを何でも安全に実行できることではありません。依存関係と実行条件を持ち運び、失敗を再現しやすくすることです。image・container・永続データ・公開portを分ければ、制作ツールの検証も壊しにくくなります。", "keywords": "workbench knowledge docker.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/external-ops.html", "title": "外部AI実行の運用：どこで動き、何が残るか | Claude Knowledge Hub", "desc": "クラウド・ローカル・接続アプリを区別し、実行終了と成果の受領を照合する。性能より先に、作業の境界を見えるようにします。", "keywords": "workbench knowledge external ops.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/flow.html", "title": "Flow — 生成を連打せず、ショットと編集を往復する制作環境", "desc": "Flowはモデル名ではなく、Googleの映像制作環境です。何を作るか、どの候補を残すか、どう接続するかを同じ制作の文脈で扱うための入口になります。ここでは架空の短編素材を使う工程案を説明します。実際の生成、加入、クレジット消費は行っていません。", "keywords": "workbench knowledge flow.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/gemini-advanced.html", "title": "Google AIプランの選び方 — Advancedという旧名から現行条件へ", "desc": "旧名称のURLを維持し、本文を個人向けGoogle AIプランの検討ガイドへ刷新しました。契約はモデルの名前ではなく、実際の不足と仕事量で選びます。", "keywords": "workbench knowledge gemini advanced.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/gemini-live.html", "title": "Gemini Live — 会話アプリと音声APIの体験設計", "desc": "リアルタイム対話の品質は正しい文章だけでは決まりません。返答の間、割込み、聞き直し、ツール待ち、停止を含めて、ユーザーが会話を制御できるか評価します。", "keywords": "workbench knowledge gemini live.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/gemini-omni.html", "title": "Gemini Omni — 対話型動画編集を制作工程に組み込む", "desc": "動画生成を一発の完成品として評価せず、ショットを作り、変更し、比較して採用する工程として設計します。Omniは動画理解モデルやGemini Appsそのものとは別の対象です。", "keywords": "workbench knowledge gemini omni.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/gemini-spark.html", "title": "Gemini Spark — 継続タスクを安全に委任する実践設計", "desc": "Sparkの価値はニュースの量ではなく、条件を持つ仕事を継続して進めることです。タスク、手順、予定、接続先、停止を別々に扱います。", "keywords": "workbench knowledge gemini spark.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/gemini.html", "title": "Gemini実践ガイド — 会話アプリとAPIを分けて使う", "desc": "Geminiは長い入力が入るだけのチャットではありません。資料の読み方、出力の契約、ツール範囲、検証工程まで設計すると、実務に使える部品になります。", "keywords": "workbench knowledge gemini.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/gemma.html", "title": "Gemma 4 — ローカル推論を仕事にするための選択・計測・限界", "desc": "オープンモデルの利点は、自分の計算機・データ・評価工程で動作を設計できることです。「ローカルだから無料で安全」と結論づけず、モデル、runtime、保存、品質を個別に確認します。", "keywords": "workbench knowledge gemma.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/git-basics.html", "title": "GitとGitHub — 更新を安全に届ける | Claude Knowledge Hub", "desc": "Gitは変更の履歴を管理する道具、GitHubはその履歴を共有しレビューや公開を行うサービスです。「ローカルに保存」「commit」「push」「mainへmerge」「サイトのdeploy」は別の出来事です。どこまで終わったかを区別できれば、AIが毎日書く記事と人間が直す解説を、互いの変更を消さずに運用できます。", "keywords": "workbench knowledge git basics.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/github-copilot.html", "title": "GitHub Copilot：コード変更をreview可能な仕事にする | AI Knowledge Hub", "desc": "補完、IDEのagent、cloud agent、code reviewを役割で選ぶ。現在のAI Credits、repo範囲、実行時間、権限とテストを分けて理解する。", "keywords": "workbench knowledge github copilot.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/glm.html", "title": "GLM実務ガイド — Thinking・Coding Plan・公開重みの境界 | Knowledge", "desc": "GLMという一語で、APIモデル、Coding Plan、Z.aiのアプリ、AutoClaw、公開重みを同一視しない。移行で壊れやすいparameterとquotaの単位を先に理解し、使える仕事だけを小さく検証します。", "keywords": "workbench knowledge glm.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/google-ecosystem.html", "title": "Google AIを用途から選ぶ — モデル・アプリ・制作・運用の地図", "desc": "同じGeminiという名前でも、会話アプリ、API、企業基盤、資料ノート、常駐エージェントは別の道具です。成果物とデータ境界から入口を選びます。", "keywords": "workbench knowledge google ecosystem.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/graph-engineering.html", "title": "グラフ設計：関係を検索と実行に使い分ける | Claude Knowledge Hub", "desc": "知識のつながりと、仕事の進み方は別のグラフです。図を増やすのではなく、どの問いと失敗を扱えるようになるかで設計します。", "keywords": "workbench knowledge graph engineering.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/grok-build.html", "title": "Grok Build — 再現・最小diff・検証で開発を閉じる | Claude Knowledge Hub", "desc": "coding agentをコード生成機ではなく、仕様から証拠までつなぐ実装担当として使います。権限とsandboxの違い、macOSの制約、並列作業の分担までを具体化します。", "keywords": "workbench knowledge grok build.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/grok.html", "title": "Grok実務ガイド — モデル・API・Build・Botを選ぶ | Claude Knowledge Hub", "desc": "話題への反応速度を、根拠のある調査と実物の完成へつなげます。どの入口を使い、何を任せ、何を完了証拠として見るかを用途から考えるガイドです。", "keywords": "workbench knowledge grok.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/harness-engineering.html", "title": "ハーネス設計：モデルの周りに検査できる実行環境を作る | Claude Knowledge Hub", "desc": "エージェントの品質はモデルだけで決まりません。道具、権限、状態、ログ、終了判定を束ねる実行環境を設計します。", "keywords": "workbench knowledge harness engineering.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/hermes-agent.html", "title": "Hermes Agent：学習をスキルと記憶へ変える運用設計 | Claude Knowledge Hub", "desc": "Hermes Agent は Nous Research のエージェント基盤である。重要なのは「使うほど賢くなる」という一言より、経験をどこへ保存し、次回どの条件で再利用するかである。CLI、Gateway、ツールの backend、保存層を組み合わせるため、モデルの文章能力と、手順を育てる運用能力を別々に評価する。Hermes Agent 公式リポジトリ 本記事は特定組織の常設構成や採用状態を記載しない。", "keywords": "workbench knowledge hermes agent.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/imagen.html", "title": "Imagen — Gemini API提供終了を踏まえた画像生成の移行ガイド", "desc": "古いImagen記事をそのまま使うと、すでに停止したAPIを新規工程へ組み込む可能性があります。このページは現役モデルの推奨一覧ではなく、Imagenを使っていたGemini API工程を点検する移行ガイドへ更新しました。Google Cloud、Webアプリ、APIを同じ提供面と扱わないことが最初の条件です。", "keywords": "workbench knowledge imagen.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/index.html", "title": "Knowledge：モデルより、用途と仕組みから", "desc": "目的に合う道具を選ぶための詳細解説です。公式事実、提供側評価、未実行の教材を分けて読みます。", "keywords": "workbench knowledge index.html", "category": "workbench", "kind": "navigation_or_template"}, {"url": "workbench/knowledge/intelligence-matrix.html", "title": "Intelligence Matrix：モデルを順位ではなく仕事で選ぶ | Claude Knowledge Hub", "desc": "単一の「賢さ」ではなく、必要能力・接点・根拠・評価条件の行列を作る。カタログと自分の試験結果を混ぜない選び方です。", "keywords": "workbench knowledge intelligence matrix.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/jules.html", "title": "Jules — 非同期のコード修正をレビュー可能な仕事にする", "desc": "コーディングエージェントの価値は、差分を増やすことではありません。対象・再現条件・完了条件を渡し、独立して確かめられる修正候補を受け取ることです。", "keywords": "workbench knowledge jules.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/kimi.html", "title": "Kimiの長時間タスク設計 — 履歴契約・視覚・再開 | Knowledge", "desc": "長いcontextと自律実行は、同じ話ではありません。Kimiのモデル、API、Kimi Code、Webの成果物作成機能を分け、途中で失敗しても根拠を残して再開できる仕事を設計します。", "keywords": "workbench knowledge kimi.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/llama.html", "title": "Llama — Open-weightを自分の運用へ持ち込む設計 | Claude Knowledge Hub", "desc": "weightを取得できる価値は、推論環境と更新時期を選べることです。MoE、メモリ、量子化、license、検索品質を分解し、ローカル採用を判断するための具体的な評価方法を示します。", "keywords": "workbench knowledge llama.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/loop-engineering.html", "title": "ループ設計：反復を成果へ収束させる | Claude Knowledge Hub", "desc": "自律性を「止まらず動くこと」で測らない。観測、行動、検証を繰り返しても、根拠・範囲・終了条件が変質しないようにします。", "keywords": "workbench knowledge loop engineering.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/lyria.html", "title": "Lyria — 音楽の長さと役割を分け、映像・ゲームへ渡す", "desc": "音楽生成の入口は「良い曲を作って」ではなく、「この作品のどの時間帯で、何を支える音が必要か」です。歌として聴かせる、場面の感情を補助する、操作を邪魔しない背景にする、という役割では評価が変わります。本稿は架空の教材を使った制作方法の提案で、楽曲を生成した実績ではありません。", "keywords": "workbench knowledge lyria.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/m365-copilot-guide.html", "title": "Copilot実践：下書きの価値を検証する | AI Knowledge Hub", "desc": "操作一覧よりも、入力の準備、根拠の確認、差戻し、再利用の手順を深く扱う。少数の実務シナリオで、AIを仕事に組み込む判断を学ぶ。", "keywords": "workbench knowledge m365 copilot guide.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/m365-copilot.html", "title": "Microsoft Copilot：仕事データと下書きをつなぐ | AI Knowledge Hub", "desc": "旧Microsoft 365 Copilotを、現在の名称・データの根拠・ライセンス別の体験から読み直す。便利さより先に、どの資料をどの権限で参照したかを理解する。", "keywords": "workbench knowledge m365 copilot.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/mac.html", "title": "Mac制作環境 — ショートカットより先に作業を失わない設計 | Claude Knowledge Hub", "desc": "WindowsからMacへ移る時、キーの置換だけでは使いやすい制作環境になりません。アプリの終了、ファイルの場所、CPU architecture、権限、復元方法を順に理解すると、AIを含む制作ツールの問題を切り分けやすくなります。このページは一般的なMacの説明であり、特定利用者の設定や内部の保存先を公開するものではありません。", "keywords": "workbench knowledge mac.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/microsoft-agent-framework.html", "title": "Microsoft Agent Framework：agentを工程として設計する | AI Knowledge Hub", "desc": "Semantic KernelやAutoGenの後継として、agent・workflow・session・middlewareを使い分ける。多人数の会話ではなく、再現と失敗制御のためのコード基盤を理解する。", "keywords": "workbench knowledge microsoft agent framework.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/microsoft-ecosystem.html", "title": "Microsoft AIを選ぶための地図 | AI Knowledge Hub", "desc": "モデル名からではなく、成果物・データ・実行権限からサービスを選ぶ。Copilotという同じ語で異なる契約や実行基盤を混同しないための総覧。", "keywords": "workbench knowledge microsoft ecosystem.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/mistral.html", "title": "Mistral — Large 4、OCR、音声を工程から選ぶ | Claude Knowledge Hub", "desc": "モデル競争の順位ではなく、文書・音声・検索を正確に扱うpipelineを設計します。新しいLarge 4のPreview条件と、OCR 4.1の根拠へ戻れる構造を軸に、実務導入を判断します。", "keywords": "workbench knowledge mistral.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/model-generations.html", "title": "モデル世代の読み方：名前・ID・提供面・評価を分ける | Knowledge", "desc": "モデルの「最新」だけでは、正しい選択になりません。識別子、入口、提供段階、license、試験条件までを一つの候補として扱います。", "keywords": "workbench knowledge model generations.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/notebooklm.html", "title": "Gemini Notebook（旧NotebookLM）— 資料を読んで判断へつなぐ", "desc": "資料ノートの価値は、綺麗な要約を量産することではありません。主張を出典へ戻し、対立を見つけ、次の問いを作れることです。旧NotebookLMのURLは維持し、現行公式名を示します。", "keywords": "workbench knowledge notebooklm.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/obsidian.html", "title": "Obsidian — ノートを根拠付きの再利用素材にする | Claude Knowledge Hub", "desc": "Obsidianの価値は巨大なグラフを眺めることより、必要な時に元の根拠へ戻れることです。Markdownの本文、properties、リンク、Basesを役割で分けると、AIへの入力にも、人間の判断にも使える知識棚を作れます。AI機能を追加する前に、保存と公開の境界を決めましょう。", "keywords": "workbench knowledge obsidian.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/ontology-engineering.html", "title": "オントロジー設計：AIが同じ言葉で別のものを指さないために | Claude Knowledge Hub", "desc": "検索の前に、何を同じ対象として扱うかを決める。万能な上位技術ではなく、共有する意味と関係の契約を作る仕事です。", "keywords": "workbench knowledge ontology engineering.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/opal.html", "title": "Opal — ノーコードAIアプリを入力・工程・検査で設計する", "desc": "自然言語でアプリを作れることと、意味の正しいworkflowができることは別です。小さな入口を作り、工程を読み、反例で試し、共有境界を確かめます。", "keywords": "workbench knowledge opal.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/openai-codex.html", "title": "Codexで開発を検証可能に進める | Knowledge", "desc": "新機能の年表ではなく、環境の選択・依頼・実装・検証・公開の区切り方を扱います。", "keywords": "workbench knowledge openai codex.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/openai-flow.html", "title": "OpenAI製品をつなぐワークフロー設計 | Knowledge", "desc": "会話を重ねるだけでなく、仕事を検証して次に渡せる形にするための設計ガイドです。", "keywords": "workbench knowledge openai flow.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/openclaw.html", "title": "OpenClaw を理解する：自律性より先に、状態と権限を設計する | Claude Knowledge Hub", "desc": "OpenClaw は「常に起きている AI」という印象で紹介されがちだが、実際に運用で必要なのは、依頼の入口、作業の状態、道具の権限、完成の証拠である。このページは導入コマンドを並べるのではなく、常設エージェントの仕組みを理解するための概念編である。操作手順と章別の詳しい検討は OpenClaw 学習ガイド に分けた。", "keywords": "workbench knowledge openclaw.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/openclaw/architecture.html", "title": "OpenClaw アーキテクチャ：Gateway と実行の流れを追う | Claude Knowledge Hub", "desc": "アーキテクチャを理解する目的は、構成図を暗記することではない。依頼が来たのに結果がない、結果はあるのに通知されない、同じ依頼が二度走る、といった現象をどの段階の問題か切り分けるためである。OpenClaw の主な登場人物を、実行の順序と権限の境界で読む。", "keywords": "workbench knowledge openclaw architecture.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/openclaw/case-studies.html", "title": "OpenClaw ケース設計：導入効果を検証する三つの小さな仕事 | Claude Knowledge Hub", "desc": "このページは導入済みの成功事例集ではない。公開情報から構成を考える、筆者の仮説と評価案である。エージェントが便利そうという印象を、何が減り、どの失敗が増え、どこで止めるかという具体的な判断へ変える。人や組織の実際のデータは例に含めない。", "keywords": "workbench knowledge openclaw case studies.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/openclaw/cookbook.html", "title": "OpenClaw クックブック：証拠と停止条件を持つ三つの依頼 | Claude Knowledge Hub", "desc": "良い依頼は、長く詳しいだけではない。入力と許される効果、完成の証拠、不明なときの停止を定める。ここでは公開または合成した材料で使える三つの教材を示す。実際に実行して成果を測った例ではなく、筆者の設計提案である。文章をコピーしても、ツールや通信の許可を追加することにはならない。", "keywords": "workbench knowledge openclaw cookbook.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/openclaw/index.html", "title": "OpenClaw 学習ガイド：最短の導入より、説明できる運用へ | Claude Knowledge Hub", "desc": "この学習ガイドは、OpenClaw をとりあえず動かすだけでなく、依頼の受け付けから結果の確認まで説明できる状態を目指す。まず何を任せたいか決め、実行場所と権限を読み、その後に導入と観測へ進む。読む順序は用途で変えてよいが、安全境界を後回しにしたままチャネルやツールを増やすことは薦めない。", "keywords": "workbench knowledge openclaw index.html", "category": "workbench", "kind": "navigation_or_template"}, {"url": "workbench/knowledge/openclaw/mission-control.html", "title": "Control UI と運用観測：画面の状態を、完成の証拠へつなぐ | Claude Knowledge Hub", "desc": "このページの URL は旧記事から保持するが、Mission Control という名前だけで特定の公式製品や標準の mission 設定形式があるとは扱わない。ここでは公式の Control UI と状態確認を中心に、「運用者が依頼と結果を見渡す」機能を説明する。存在を確認していない dashboard API や mission.yaml は作らない。", "keywords": "workbench knowledge openclaw mission control.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/openclaw/reference.html", "title": "OpenClaw リファレンス：設定名より先に、責任の場所を探す | Claude Knowledge Hub", "desc": "このリファレンスは全設定を複製する辞書ではない。OpenClaw は文書も実装も速く変わるため、古い JSON を長く配布するより、何を変えたいときにどの公式文書へ戻るかを示す。確認していない mission 設定や独自の API を標準機能として掲載しない。", "keywords": "workbench knowledge openclaw reference.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/openclaw/security.html", "title": "OpenClaw の安全境界：入口・道具・実行・記憶を別々に守る | Claude Knowledge Hub", "desc": "常設エージェントの安全性は、モデルへ「気をつけて」と書くだけでは設計できない。入力が指示に見えること、道具に効果があること、状態が次の会話へ残ることを前提に、到達できる対象を制限する。本稿は安全認定や脆弱性監査ではなく、公式文書を使って自分の構成の脅威を列挙するためのガイドである。", "keywords": "workbench knowledge openclaw security.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/openclaw/setup.html", "title": "OpenClaw セットアップ：変更を理解してから段階的に接続する | Claude Knowledge Hub", "desc": "セットアップの目的は、コマンドが終了することではなく、何が保存され、何が常設され、どの入力が外へ送られるか理解した状態で最初の仕事を実行することである。本稿は公式手順を読むためのチェックガイドで、インストール、認証、サービス作成を代わりに実行するものではない。", "keywords": "workbench knowledge openclaw setup.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/openclaw/troubleshooting.html", "title": "OpenClaw トラブルシューティング：再インストールの前に層を分ける | Claude Knowledge Hub", "desc": "問題が出たら最初に全部を初期化する、という方法では原因も回復条件も学べない。OpenClaw は入口、Gateway、モデル、ツール、保存、配送から成る。症状をどの層の問題か切り分け、状態を読んでから一つの変更へ進む。本稿は診断の考え方であり、運用サービスの再起動や認証変更を実行する指示ではない。", "keywords": "workbench knowledge openclaw troubleshooting.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/phi.html", "title": "Phi：小さなopen-weightモデルを仕事に合わせる | AI Knowledge Hub", "desc": "Phiを一つの万能モデルとして扱わず、text・推論・vision、重み・量子化・runtimeの違いを理解する。日本語と実データの評価を中心に選ぶ。", "keywords": "workbench knowledge phi.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/physical-ai.html", "title": "Physical AI — 文章の正しさから、観測と行動の検証へ | Claude Knowledge Hub", "desc": "Physical AIは現実やsimulationの環境を観測し、行動を通じてtaskを遂行するAIを考える領域です。VLA、world model、robot controllerは同じものではありません。映像が自然、指示を説明できる、robotが安全に動く、という三つの成功を分けることが最初の判断になります。", "keywords": "workbench knowledge physical ai.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/pi-coding-agent.html", "title": "Pi coding agent — 小さなharnessと大きな実行権限を理解する | Claude Knowledge Hub", "desc": "Piはearendil-worksの最小・拡張可能なagent harnessです。独自LLMではなく、モデルへの接続、tool実行、会話と開発workflowを組み合わせる道具です。小さいcoreは理解や改造の入口になりますが、小さいこと自体は安全、低コスト、高性能の保証ではありません。", "keywords": "workbench knowledge pi coding agent.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/power-automate-guide.html", "title": "Power Automate：失敗から復旧できる自動処理 | AI Knowledge Hub", "desc": "成功経路を増やすより、重複・timeout・認証拒否・容量切れをどう扱うか。反復処理を小さく設計し、結果不明を無確認で再送しない実践ガイド。", "keywords": "workbench knowledge power automate guide.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/power-platform-ai.html", "title": "Power Platform AI：業務を型にしてから知能を足す | AI Knowledge Hub", "desc": "Power Apps、Power Automate、Dataverse、AI Builder、Copilot Studioの役割を整理。AIの出力をそのまま業務の確定値にしない設計を考える。", "keywords": "workbench knowledge power platform ai.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/power-platform-guide.html", "title": "Power Platform実践：小さな業務を運用可能にする | AI Knowledge Hub", "desc": "アイデアを大量に並べるのではなく、一つの受付業務をデータモデル、確認画面、flow、例外処理、版管理まで設計するためのガイド。", "keywords": "workbench knowledge power platform guide.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/prompt-engineering.html", "title": "プロンプト設計：うまい言い回しより検査できる契約 | Claude Knowledge Hub", "desc": "期待する結果、使う根拠、制約、未知の扱いを一つの依頼にする。モデルの説得ではなく、再現可能な入力を作ります。", "keywords": "workbench knowledge prompt engineering.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/qwen.html", "title": "Qwen選択ガイド — API・公開重み・Qwen Code | Knowledge", "desc": "Qwenは一つのモデルではなく、商用API、サイズの異なる公開重み、画像・音声系モデル、開発ツールが重なるエコシステムです。ブランドからartifactへ選択単位を移すことが実務の第一歩です。", "keywords": "workbench knowledge qwen.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/slm-guide.html", "title": "小型・ローカルLLM — サイズでなくtaskと実行条件で選ぶ | Claude Knowledge Hub", "desc": "SLMという呼び方に、すべての分野で共通するparameter数の境界はありません。少ない重み、低bit表現、少ないactive parameters、短いcontextは別の性質です。小さいという名前だけで品質やprivacyを保証せず、必要な仕事を小さなfixtureへ分解すると、ローカルAIを比較しやすくなります。", "keywords": "workbench knowledge slm guide.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/veo.html", "title": "Veo — 短いショットを設計し、編集可能な素材として受け取る", "desc": "Veoを「文章から完成映画を作る機械」として扱うと、物語の都合より偶然の映像に工程が引っ張られます。実務では、前後の編集点が決まった短いショットを作り、採用理由を説明できる素材として管理する方が扱いやすい。本稿の工程は筆者の設計案です。以下の例は架空の教材で、映像生成や品質検証を実施した記録ではありません。", "keywords": "workbench knowledge veo.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/vertex-ai.html", "title": "Vertex AIからAgent Platformへ — 企業AIを運用単位で設計する", "desc": "企業AIの選択は、モデルの能力比較だけでは終わりません。誰の権限で何を読み、どこへ出し、いくらで運用し、どう失敗を検知するかが中心です。旧Vertex AI URLを維持し、現在の公式入口へつなぎます。", "keywords": "workbench knowledge vertex ai.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/vscode.html", "title": "VS Code — 編集・実行・AI支援を混ぜずに使う | Claude Knowledge Hub", "desc": "VS Codeはコードを読む、編集する、差分を確認するための土台です。言語runtime、debugger、Git、AI extensionはそれぞれ別の部品です。「エディタをinstallしたので全部動く」と期待せず、一つのprojectで保存からテストまでを確かめると、AIが増えても作業が見えなくなりません。", "keywords": "workbench knowledge vscode.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/knowledge/workspace-ai.html", "title": "Workspace AI — 文書・メール・会議の仕事を小さく改善する", "desc": "業務アプリにAIが入ると、資料を渡す手間は減ります。しかし出力の正確さ、共有範囲、送信責任は残ります。個人Geminiと企業Workspaceの条件を分けて導入します。", "keywords": "workbench knowledge workspace ai.html", "category": "workbench", "kind": "current_guide"}, {"url": "workbench/vibe-coding-guide/index.html", "title": "Vibe Coding：意図から検査できる実物へ | Workbench", "desc": "AIとの対話を、動くものと再利用可能な失敗知見へ変える実践ガイドです。大きな一括生成より、一つの機能を端から端まで確かめる流れを扱います。", "keywords": "workbench vibe coding guide index.html", "category": "workbench", "kind": "navigation_or_template"}, {"url": "research/archive/index.html", "title": "旧版の資料棚 | Research", "desc": "刷新前の本文は、新版に追記・折り畳みで混ぜず、この固定版から読むことができます。", "keywords": "research archive index.html", "category": "research", "kind": "navigation_or_template"}, {"url": "research/official-model-delta-2026-10-13.html", "title": "主要AI公式差分：2026-10-13確認 | Research", "desc": "10月1日版を上書きせず、新しい確認範囲を別snapshotとして残します。catalog全体は現行ledgerへ。", "keywords": "research official model delta 2026 10 13.html", "category": "research", "kind": "historical_record"}, {"url": "research/refresh-2026-10-13/index.html", "title": "2026-10-13 刷新の根拠と検査資料", "desc": "記事の根拠、非著者の重点照合、構造検査を区別して読む資料棚です。JSONを置いたことだけでは正しさを認定しません。", "keywords": "research refresh 2026 10 13 index.html", "category": "research", "kind": "navigation_or_template"}],q=document.querySelector("#q"),kind=document.querySelector("#kind"),results=document.querySelector("#results");
const norm=s=>s.normalize("NFKC").toLowerCase();
function draw(){const words=norm(q.value).trim().split(/\s+/).filter(Boolean);const mode=kind.value;const list=pages.filter(p=>{const historical=["historical_record","retained_public_review"].includes(p.kind);return (mode==="all"||(mode==="history"?historical:!historical))&&words.every(w=>norm([p.title,p.desc,p.keywords,p.url].join(" ")).includes(w));});results.replaceChildren();for(const p of list){const li=document.createElement("li"),a=document.createElement("a"),d=document.createElement("p");a.href=p.url;a.textContent=p.title;d.className="small";d.textContent=p.desc+" — "+(p.kind==="historical_record"?"日付付き観測・履歴":p.kind==="retained_public_review"?"既存公開レビュー・保持":"現行の読み口");li.append(a,d);results.append(li);}document.querySelector("#count").textContent=list.length+"件 / "+pages.length+"件";}
q.addEventListener("input",draw);kind.addEventListener("change",draw);draw();
